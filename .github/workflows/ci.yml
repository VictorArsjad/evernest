name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evernest
          POSTGRES_PASSWORD: evernest_dev
          POSTGRES_DB: evernest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evernest -d evernest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests read DATABASE_URL; with CI=true (set by Actions) they
      # fail instead of skipping when Postgres is unreachable.
      DATABASE_URL: postgres://evernest:evernest_dev@localhost:5432/evernest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: build
        run: go build ./...
      - name: install migrate
        run: |
          curl -sSfL https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xz -C /tmp migrate
          sudo mv /tmp/migrate /usr/local/bin/migrate
      - name: apply migrations
        run: migrate -path migrations -database "$DATABASE_URL" up
      - name: test
        run: go test ./... -race -count=1
      - name: golangci-lint
        # v9 is required for golangci-lint v2.x; v6 hard-pins to v1.64.8
        # which can't load go.mod targeting Go 1.26+.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: apps/api
          args: --timeout=5m

  web:
    name: web (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evernest
          POSTGRES_PASSWORD: evernest_dev
          POSTGRES_DB: evernest_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evernest -d evernest_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/e2e/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: install migrate
        run: |
          curl -sSfL https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xz -C /tmp migrate
          sudo mv /tmp/migrate /usr/local/bin/migrate
      - name: install web deps
        run: npm ci
        working-directory: apps/web
      - name: install e2e deps
        run: npm ci
        working-directory: apps/e2e
      - name: build web + embedspa binary
        run: ./apps/e2e/scripts/build.sh
      - name: apply migrations
        run: ./apps/e2e/scripts/db.sh
      - name: resolve playwright version
        id: pw
        working-directory: apps/e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: cache playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - name: install browser + OS deps
        working-directory: apps/e2e
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: e2e
        working-directory: apps/e2e
        run: npx playwright test --project=${{ matrix.browser }}
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
